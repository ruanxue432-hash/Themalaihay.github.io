<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox 3D Avatar Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; pointer-events: none; border: 1px solid #334155; }
        h1 { font-size: 18px; color: #38bdf8; margin-bottom: 5px; }
        p { font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Mô Phỏng Nhân Vật Roblox 3D</h1>
        <p>• Kéo chuột trái: Xoay góc nhìn</p>
        <p>• Cuộn chuột: Phóng to / Thu nhỏ</p>
        <p>• Kéo chuột phải: Di chuyển Camera</p>
    </div>

    <!-- Nhúng Three.js và OrbitControls từ CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Khởi tạo Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Thêm Điều khiển chuột (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.5, 0);

        // 3. Ánh sáng (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 4. Mặt đất (Sàn Roblox)
        const gridHelper = new THREE.GridHelper(20, 20, 0x38bdf8, 0x334155);
        scene.add(gridHelper);

        // 5. DỰNG NHÂN VẬT ROBLOX (BLOCKY AVATAR)
        const robloxCharacter = new THREE.Group();

        // Material màu sắc cơ bản
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffcd38 }); // Vàng Roblox
        const torsoMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 }); // Áo xanh dương
        const limbMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });  // Tay xanh dương
        const legMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });   // Quần đen/xám

        // Thân (Torso)
        const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
        torso.position.y = 2.5;
        torso.castShadow = true;
        robloxCharacter.add(torso);

        // Đầu (Head)
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
        head.position.y = 4.2;
        head.castShadow = true;
        robloxCharacter.add(head);

        // Mắt/Miệng đơn giản trên mặt Roblox
        const faceMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const eyeLeft = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.05), faceMat);
        eyeLeft.position.set(-0.3, 4.3, 0.61);
        robloxCharacter.add(eyeLeft);

        const eyeRight = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.05), faceMat);
        eyeRight.position.set(0.3, 4.3, 0.61);
        robloxCharacter.add(eyeRight);

        // Tay trái (Left Arm)
        const armLeft = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 0.9), limbMat);
        armLeft.position.set(-1.5, 2.5, 0);
        armLeft.castShadow = true;
        robloxCharacter.add(armLeft);

        // Tay phải (Right Arm)
        const armRight = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 0.9), limbMat);
        armRight.position.set(1.5, 2.5, 0);
        armRight.castShadow = true;
        robloxCharacter.add(armRight);

        // Chân trái (Left Leg)
        const legLeft = new THREE.Mesh(new THREE.BoxGeometry(0.95, 2, 0.95), legMat);
        legLeft.position.set(-0.5, 0.5, 0);
        legLeft.castShadow = true;
        robloxCharacter.add(legLeft);

        // Chân phải (Right Leg)
        const legRight = new THREE.Mesh(new THREE.BoxGeometry(0.95, 2, 0.95), legMat);
        legRight.position.set(0.5, 0.5, 0);
        legRight.castShadow = true;
        robloxCharacter.add(legRight);

        scene.add(robloxCharacter);

        // 6. Animation (Hiệu ứng nhún nhảy + xoay)
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Nhún nhảy nhẹ lên xuống
            robloxCharacter.position.y = Math.sin(elapsedTime * 3) * 0.1;

            // Đung đưa 2 tay kiểu Idle animation
            armLeft.rotation.x = Math.sin(elapsedTime * 2) * 0.2;
            armRight.rotation.x = -Math.sin(elapsedTime * 2) * 0.2;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize màn hình tự co giãn
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
