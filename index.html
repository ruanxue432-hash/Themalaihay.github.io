<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML/JS CODE RUNNER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #0e1017; color: #fff; padding: 10px; display: flex; flex-direction: column; height: 100vh; gap: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; }
        h3 { color: #00ff66; font-size: 14px; }
        
        button {
            background: #00ff66; color: #000; border: none; padding: 8px 16px;
            font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        button:hover { opacity: 0.8; }

        .editor-container { display: flex; flex: 1; gap: 10px; height: calc(100% - 50px); }
        @media (max-width: 600px) { .editor-container { flex-direction: column; } }

        textarea {
            flex: 1; background: #161922; color: #00ff66; border: 1px solid #2a2e3d;
            padding: 10px; border-radius: 6px; outline: none; resize: none; font-size: 12px;
        }

        iframe {
            flex: 1; background: #fff; border: 1px solid #2a2e3d; border-radius: 6px; width: 100%; height: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h3>MÔ PHỎNG WEB TĨNH (HTML/CSS/JS)</h3>
        <button onclick="runCode()">BẮT ĐẦU CHẠY</button>
    </div>

    <div class="editor-container">
        <textarea id="codeArea" placeholder="Dán code HTML/CSS/JS vào đây..."></textarea>
        <iframe id="preview"></iframe>
    </div>

    <script>
        function runCode() {
            const code = document.getElementById('codeArea').value;
            const preview = document.getElementById('preview').contentWindow.document;
            
            preview.open();
            preview.write(code);
            preview.close();
        }
    </script>

</body>
</html>
