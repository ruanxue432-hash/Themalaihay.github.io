<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roblox 3D - Joystick, Nhảy & Chạy Nhanh</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; touch-action: none; }
        
        /* Joystick Cần Kéo (Góc dưới bên trái) */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        #joystick-stick {
            width: 50px;
            height: 50px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            transform: translate(0px, 0px);
        }

        /* Nút Hành Động (Góc dưới bên phải) */
        #action-buttons {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .action-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        #btn-jump { background: rgba(34, 197, 94, 0.4); }
        #btn-jump:active { background: #22c55e; }
        #btn-sprint { background: rgba(234, 179, 8, 0.4); }
        #btn-sprint.active { background: #eab308; color: #000; }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info">
        🕹️ <b>Kéo Cần:</b> Di chuyển | 🔄 <b>Vuốt Phải:</b> Xoay camera<br>
        🦘 <b>JUMP:</b> Nhảy | ⚡ <b>SPRINT:</b> Giữ chạy nhanh
    </div>

    <!-- Joystick Zone -->
    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <!-- Action Buttons -->
    <div id="action-buttons">
        <div class="action-btn" id="btn-sprint">⚡ SPRINT</div>
        <div class="action-btn" id="btn-jump">▲ JUMP</div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 12, 8);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Sàn đấu (Grid)
        const gridHelper = new THREE.GridHelper(50, 50, 0x38bdf8, 0x334155);
        scene.add(gridHelper);

        // 2. Tạo Nhân Vật Roblox
        function createRobloxCharacter(colorHex) {
            const charGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: colorHex });
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcd38 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), mat);
            torso.position.y = 2.5;
            torso.castShadow = true;
            charGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.2;
            head.castShadow = true;
            charGroup.add(head);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), mat);
            armL.position.set(-1.4, 2.5, 0);
            charGroup.add(armL);

            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), mat);
            armR.position.set(1.4, 2.5, 0);
            charGroup.add(armR);

            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 0.9), mat);
            legL.position.set(-0.5, 0.5, 0);
            charGroup.add(legL);

            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 0.9), mat);
            legR.position.set(0.5, 0.5, 0);
            charGroup.add(legR);

            return { group: charGroup, armL, armR, legL, legR };
        }

        const p1 = createRobloxCharacter(0x0284c7); // Player (Xanh)
        p1.group.position.set(0, 0, 0);
        scene.add(p1.group);

        const p2 = createRobloxCharacter(0xef4444); // NPC (Đỏ)
        p2.group.position.set(4, 0, -3);
        scene.add(p2.group);

        // 3. Cơ chế Xoay Màn Hình (Camera Orbit)
        let camYaw = 0;
        let camPitch = 0.3;
        const camDistance = 12;

        let isCamDragging = false;
        let prevTouchX = 0, prevTouchY = 0;

        // 4. Cơ chế Joystick Kéo Cảm Ứng
        const zone = document.getElementById('joystick-zone');
        const stick = document.getElementById('joystick-stick');
        let joyVector = { x: 0, y: 0 };
        let joyActive = false;
        let joyTouchId = null;

        const maxRadius = 45;

        function handleJoyMove(clientX, clientY) {
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            let dist = Math.hypot(deltaX, deltaY);

            if (dist > maxRadius) {
                deltaX = (deltaX / dist) * maxRadius;
                deltaY = (deltaY / dist) * maxRadius;
            }

            stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            joyVector.x = deltaX / maxRadius;
            joyVector.y = deltaY / maxRadius;
        }

        function resetJoy() {
            stick.style.transform = `translate(0px, 0px)`;
            joyVector = { x: 0, y: 0 };
            joyActive = false;
            joyTouchId = null;
        }

        // Bắt sự kiện Joystick & Camera
        window.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                const targetBtn = touch.target.closest('.action-btn');
                const targetJoy = touch.target.closest('#joystick-zone');

                if (targetJoy && joyTouchId === null) {
                    joyActive = true;
                    joyTouchId = touch.identifier;
                    handleJoyMove(touch.clientX, touch.clientY);
                } else if (!targetBtn && !targetJoy) {
                    isCamDragging = true;
                    prevTouchX = touch.clientX;
                    prevTouchY = touch.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    handleJoyMove(touch.clientX, touch.clientY);
                } else if (isCamDragging) {
                    let dX = touch.clientX - prevTouchX;
                    let dY = touch.clientY - prevTouchY;
                    camYaw -= dX * 0.005;
                    camPitch += dY * 0.005;
                    camPitch = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, camPitch));
                    prevTouchX = touch.clientX;
                    prevTouchY = touch.clientY;
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) resetJoy();
            }
            if (e.touches.length === 0) isCamDragging = false;
        });

        // Chuột máy tính hỗ trợ Joystick
        let isMouseDownJoy = false;
        zone.addEventListener('mousedown', (e) => {
            isMouseDownJoy = true;
            handleJoyMove(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            if (isMouseDownJoy) {
                handleJoyMove(e.clientX, e.clientY);
            } else if (isCamDragging) {
                let dX = e.clientX - prevTouchX;
                let dY = e.clientY - prevTouchY;
                camYaw -= dX * 0.005;
                camPitch += dY * 0.005;
                camPitch = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, camPitch));
                prevTouchX = e.clientX;
                prevTouchY = e.clientY;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isMouseDownJoy) { isMouseDownJoy = false; resetJoy(); }
            isCamDragging = false;
        });

        // Kéo camera bằng chuột ngoài vùng UI
        window.addEventListener('mousedown', (e) => {
            if (!e.target.closest('#joystick-zone') && !e.target.closest('#action-buttons')) {
                isCamDragging = true;
                prevTouchX = e.clientX;
                prevTouchY = e.clientY;
            }
        });

        // 5. Xử Lý Nhảy & Chạy Nhanh
        let isSprinting = false;
        let velocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;

        const btnJump = document.getElementById('btn-jump');
        const btnSprint = document.getElementById('btn-sprint');

        function doJump() {
            if (isGrounded) {
                velocityY = 0.35; // Lực nhảy
                isGrounded = false;
            }
        }

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
        btnJump.addEventListener('click', doJump);

        // Nút Sprint (Chạy Nhanh)
        const toggleSprint = (state) => {
            isSprinting = state;
            btnSprint.classList.toggle('active', state);
        };
        btnSprint.addEventListener('touchstart', (e) => { e.preventDefault(); toggleSprint(true); });
        btnSprint.addEventListener('touchend', (e) => { e.preventDefault(); toggleSprint(false); });
        btnSprint.addEventListener('mousedown', () => toggleSprint(true));
        btnSprint.addEventListener('mouseup', () => toggleSprint(false));

        // Hỗ trợ phím Space (Nhảy) & Shift (Chạy nhanh) trên PC
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') doJump();
            if (e.key === 'Shift') toggleSprint(true);
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'Shift') toggleSprint(false);
        });

        // 6. Game Loop (Update)
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const moveMagnitude = Math.hypot(joyVector.x, joyVector.y);
            const isMoving = moveMagnitude > 0.1;

            // Xử lý Vật Lý Nhảy / Trọng Lực
            p1.group.position.y += velocityY;
            if (!isGrounded) {
                velocityY += gravity;
                if (p1.group.position.y <= 0) {
                    p1.group.position.y = 0;
                    velocityY = 0;
                    isGrounded = true;
                }
            }

            // Xử lý di chuyển theo Joystick
            if (isMoving) {
                const speed = (isSprinting ? 0.28 : 0.14) * moveMagnitude;
                const moveAngle = Math.atan2(joyVector.x, joyVector.y) + camYaw;

                p1.group.position.x += Math.sin(moveAngle) * speed;
                p1.group.position.z += Math.cos(moveAngle) * speed;
                p1.group.rotation.y = moveAngle;

                // Tốc độ vung tay chân theo nhịp chạy/đi
                const animSpeed = isSprinting ? 18 : 10;
                p1.armL.rotation.x = Math.sin(time * animSpeed) * 0.7;
                p1.armR.rotation.x = -Math.sin(time * animSpeed) * 0.7;
                p1.legL.rotation.x = -Math.sin(time * animSpeed) * 0.7;
                p1.legR.rotation.x = Math.sin(time * animSpeed) * 0.7;
            } else {
                p1.armL.rotation.x = 0;
                p1.armR.rotation.x = 0;
                p1.legL.rotation.x = 0;
                p1.legR.rotation.x = 0;
            }

            // NPC nhún nhảy tại chỗ
            p2.group.position.y = Math.sin(time * 3) * 0.08;

            // Cập nhật vị trí Camera đi theo Player
            const targetY = p1.group.position.y + 2;
            camera.position.x = p1.group.position.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch);
            camera.position.y = targetY + camDistance * Math.sin(camPitch);
            camera.position.z = p1.group.position.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch);
            camera.lookAt(p1.group.position.x, targetY, p1.group.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
