<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roblox 3D - Di Chuyển & Xoay Camera 360</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: Arial, sans-serif; touch-action: none; }
        
        /* Giao diện nút D-Pad di chuyển */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .btn:active { background: #38bdf8; color: #000; }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        #btn-right { grid-column: 3; grid-row: 2; }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info">
        🎮 <b>Di chuyển:</b> D-Pad hoặc WASD / Mũi tên<br>
        🔄 <b>Xoay màn hình:</b> Vuốt màn hình / Kéo giữ chuột trái
    </div>

    <!-- D-Pad Controls -->
    <div id="controls">
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-down">▼</div>
        <div class="btn" id="btn-right">▶</div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 12, 8);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Sàn đấu (Grid)
        const gridHelper = new THREE.GridHelper(40, 40, 0x38bdf8, 0x334155);
        scene.add(gridHelper);

        // 2. Tạo nhân vật Roblox
        function createRobloxCharacter(colorHex) {
            const charGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: colorHex });
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcd38 }); // Đầu vàng

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), mat);
            torso.position.y = 2.5;
            torso.castShadow = true;
            charGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.2;
            head.castShadow = true;
            charGroup.add(head);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), mat);
            armL.position.set(-1.4, 2.5, 0);
            charGroup.add(armL);

            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), mat);
            armR.position.set(1.4, 2.5, 0);
            charGroup.add(armR);

            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 0.9), mat);
            legL.position.set(-0.5, 0.5, 0);
            charGroup.add(legL);

            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 0.9), mat);
            legR.position.set(0.5, 0.5, 0);
            charGroup.add(legR);

            return { group: charGroup, armL, armR, legL, legR };
        }

        const p1 = createRobloxCharacter(0x0284c7); // Player (Xanh)
        p1.group.position.set(0, 0, 0);
        scene.add(p1.group);

        const p2 = createRobloxCharacter(0xef4444); // NPC (Đỏ)
        p2.group.position.set(4, 0, -3);
        scene.add(p2.group);

        // 3. Cơ chế Xoay Màn Hình (Orbit Angles)
        let camYaw = 0;          // Góc xoay ngang (trái/phải)
        let camPitch = 0.3;      // Góc xoay dọc (lên/xuống)
        const camDistance = 12;  // Khoảng cách camera tới nhân vật

        let isDragging = false;
        let previousTouchX = 0;
        let previousTouchY = 0;

        // Xoay bằng Chuột
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#controls')) return; // Không xoay khi bấm nút D-Pad
            isDragging = true;
            previousTouchX = e.clientX;
            previousTouchY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousTouchX;
            const deltaY = e.clientY - previousTouchY;

            camYaw -= deltaX * 0.005;
            camPitch += deltaY * 0.005;
            camPitch = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, camPitch)); // Giới hạn góc nhìn dọc

            previousTouchX = e.clientX;
            previousTouchY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Xoay bằng Cảm Ứng (Điện thoại)
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#controls')) return;
            if (e.touches.length === 1) {
                isDragging = true;
                previousTouchX = e.touches[0].clientX;
                previousTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousTouchX;
            const deltaY = e.touches[0].clientY - previousTouchY;

            camYaw -= deltaX * 0.005;
            camPitch += deltaY * 0.005;
            camPitch = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, camPitch));

            previousTouchX = e.touches[0].clientX;
            previousTouchY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => isDragging = false);

        // 4. Di chuyển Nhân vật
        const keys = { forward: false, backward: false, left: false, right: false };
        const speed = 0.15;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
        });

        function setupBtn(id, key) {
            const btn = document.getElementById(id);
            const start = () => keys[key] = true;
            const end = () => keys[key] = false;

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
        }

        setupBtn('btn-up', 'forward');
        setupBtn('btn-down', 'backward');
        setupBtn('btn-left', 'left');
        setupBtn('btn-right', 'right');

        // 5. Game Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            let moveX = 0;
            let moveZ = 0;

            if (keys.forward) moveZ -= 1;
            if (keys.backward) moveZ += 1;
            if (keys.left) moveX -= 1;
            if (keys.right) moveX += 1;

            let isMoving = (moveX !== 0 || moveZ !== 0);

            if (isMoving) {
                // Tính hướng di chuyển theo góc nhìn Camera (camYaw)
                const moveAngle = Math.atan2(moveX, moveZ) + camYaw;

                p1.group.position.x += Math.sin(moveAngle) * speed;
                p1.group.position.z += Math.cos(moveAngle) * speed;

                // Quay mặt nhân vật theo hướng di chuyển
                p1.group.rotation.y = moveAngle;

                // Animation di chuyển
                p1.armL.rotation.x = Math.sin(time * 12) * 0.6;
                p1.armR.rotation.x = -Math.sin(time * 12) * 0.6;
                p1.legL.rotation.x = -Math.sin(time * 12) * 0.6;
                p1.legR.rotation.x = Math.sin(time * 12) * 0.6;
            } else {
                p1.armL.rotation.x = 0;
                p1.armR.rotation.x = 0;
                p1.legL.rotation.x = 0;
                p1.legR.rotation.x = 0;
            }

            // NPC nhún nhảy
            p2.group.position.y = Math.sin(time * 3) * 0.08;
            p2.armL.rotation.x = Math.sin(time * 2) * 0.2;
            p2.armR.rotation.x = -Math.sin(time * 2) * 0.2;

            // Cập nhật vị trí Camera xoay quanh Player
            const targetY = p1.group.position.y + 2;
            camera.position.x = p1.group.position.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch);
            camera.position.y = targetY + camDistance * Math.sin(camPitch);
            camera.position.z = p1.group.position.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch);
            camera.lookAt(p1.group.position.x, targetY, p1.group.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
